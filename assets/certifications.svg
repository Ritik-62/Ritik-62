<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

<style>
  .flow-line { stroke: #30363d; stroke-width: 1.5; fill: none; }
  .node-box { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
  .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  .status-pulse { animation: blink 1.8s ease-in-out infinite alternate; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; r: 3; } 50% { opacity: 1; r: 4.5; } }
  @keyframes blink { 0% { opacity: 0.4; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .pulse-dot, .status-pulse { animation: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="oracleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f80000"/><stop offset="1" stop-color="#b80000"/></linearGradient>
</defs>

<rect width="860" height="240" rx="10" fill="url(#bgGrad)"/>
<rect x="0.5" y="0.5" width="859" height="239" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
<line x1="0" y1="30" x2="860" y2="30" stroke="#30363d"/>
<circle cx="20" cy="15.0" r="5" fill="#ff5f56"/>
<circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="15.0" r="5" fill="#39d353"/>
<text x="430.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">ritik@github: ~$ ./certs.sh</text>


<!-- Sub Bar -->
<g transform="translate(24, 48)">
  <circle cx="8" cy="8" r="4" fill="#39d353" class="status-pulse"/>
  <text x="20" y="12" fill="#39d353" font-size="11" font-weight="700">AUTHENTICATED CREDENTIALS</text>
  <text x="270" y="12" fill="#7d8590" font-size="10.5">Cryptographically Verified Professional Certifications</text>
  <text x="812" y="12" fill="#22d3ee" font-size="10.5" text-anchor="end">STATUS: ACTIVE &amp; AUTHENTICATED</text>
</g>

<!-- Full Width Balanced Certification Card -->
<g transform="translate(24, 76)">
  <rect width="812" height="114" rx="8" class="node-box"/>
  <rect x="0" y="8" width="4" height="98" rx="2" fill="#f80000"/>
  
  <rect x="16" y="14" width="130" height="20" rx="4" fill="#0d1117" stroke="#f80000" stroke-width="0.8"/>
  <text x="81" y="27.5" fill="#f80000" font-size="9" font-weight="700" text-anchor="middle">ORACLE CERTIFIED</text>
  
  <rect x="154" y="14" width="100" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
  <text x="204" y="27.5" fill="#39d353" font-size="9" font-weight="600" text-anchor="middle">VERIFIED 2025</text>
  
  <text x="16" y="58" fill="#e6edf3" font-size="14" font-weight="700">Oracle Cloud Infrastructure 2025 Certified Data Science Professional</text>
  
  <text x="16" y="82" fill="#7d8590" font-size="10">Issuer: <tspan fill="#e6edf3">Oracle Corporation</tspan> · Domain: <tspan fill="#22d3ee">OCI Machine Learning, Data Science &amp; Pipelines</tspan></text>
  <text x="16" y="99" fill="#7d8590" font-size="10">Verification: <tspan fill="#39d353">Authenticated via Oracle CertView</tspan> · Click badge below to view record</text>
  
  <g transform="translate(560, 20)">
    <rect width="232" height="74" rx="6" fill="#0d1117" stroke="#f80000" stroke-width="1"/>
    <rect x="10" y="12" width="212" height="26" rx="4" fill="url(#oracleGrad)"/>
    <text x="116" y="29" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">ORACLE CERTIFIED PROFESSIONAL</text>
    <text x="116" y="56" fill="#e6edf3" font-size="8.5" text-anchor="middle">OCI 2025 Data Science Professional</text>
  </g>
</g>

<!-- Footer Bar -->
<g transform="translate(24, 202)">
  <rect width="812" height="26" rx="4" fill="#111722" stroke="#21262d" stroke-width="1"/>
  <circle cx="12" cy="13" r="3" fill="#39d353" class="status-pulse"/>
  <text x="22" y="16.5" fill="#39d353" font-size="9" font-weight="700">SHA256 BADGE HASH VERIFIED</text>
  <text x="796" y="16.5" fill="#22d3ee" font-size="8.5" text-anchor="end">ISSUED: 2025 · EXPIRY: ACTIVE</text>
</g>
</svg>
