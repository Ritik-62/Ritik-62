  <text x="127" y="23.5" fill="#7d8590" font-size="9" font-weight="600" text-anchor="middle">2024–25</text>
  
  <text x="176" y="24" fill="#e6edf3" font-size="12.5" font-weight="700">Data Science &amp; Statistical Analytics</text>
  
  <text x="16" y="45" fill="#e6edf3" font-size="9.5">● <tspan fill="#7d8590">Exploratory data analysis, feature engineering &amp; regression modeling · </tspan><tspan fill="#e6edf3">Analyzed 243,553 telecom records uncovering churn &amp; segmentation</tspan></text>
  <text x="16" y="59" fill="#58a6ff" font-size="9.5">● <tspan fill="#e6edf3">Oracle Cloud Infrastructure 2025 Certified Data Science Professional</tspan></text>
</g>

<g transform="translate(24, 232)">
  <rect width="812" height="68" rx="6" class="node-box"/>
  <rect x="0" y="6" width="4" height="56" rx="2" fill="#bc8cff"/>
  
  <rect x="14" y="10" width="70" height="20" rx="4" fill="#0d1117" stroke="#bc8cff" stroke-width="0.8"/>
  <text x="49" y="23.5" fill="#bc8cff" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 03</text>
  
  <rect x="90" y="10" width="74" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
  <text x="127" y="23.5" fill="#7d8590" font-size="9" font-weight="600" text-anchor="middle">2025</text>
  
  <text x="176" y="24" fill="#e6edf3" font-size="12.5" font-weight="700">Machine Learning &amp; Predictive Modeling</text>
  
  <text x="16" y="45" fill="#e6edf3" font-size="9.5">● <tspan fill="#7d8590">XGBoost and regularized Logistic classification benchmark pipelines · </tspan><tspan fill="#e6edf3">Leakage prevention protocol: chronological calendar partitions (t &lt; D)</tspan></text>
  <text x="16" y="59" fill="#bc8cff" font-size="9.5">● <tspan fill="#e6edf3">Platt calibrator fitted on val split; Brier 0.1245 on held-out test split (26 tests)</tspan></text>
</g>

<g transform="translate(24, 310)">
  <rect width="812" height="68" rx="6" class="node-box"/>
  <rect x="0" y="6" width="4" height="56" rx="2" fill="#ffa657"/>
  
  <rect x="14" y="10" width="70" height="20" rx="4" fill="#0d1117" stroke="#ffa657" stroke-width="0.8"/>
  <text x="49" y="23.5" fill="#ffa657" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 04</text>
  
