  <text x="127" y="23.5" fill="#7d8590" font-size="9" font-weight="600" text-anchor="middle">2025–26</text>
  
  <text x="176" y="24" fill="#e6edf3" font-size="12.5" font-weight="700">Retrieval-Augmented Generation (RAG)</text>
  
  <text x="16" y="45" fill="#e6edf3" font-size="9.5">● <tspan fill="#7d8590">Scholarly search retrieval pipelines with offline sample fallback · </tspan><tspan fill="#e6edf3">Schema normalization &amp; identifier hash deduplication algorithms</tspan></text>
  <text x="16" y="59" fill="#ffa657" font-size="9.5">● <tspan fill="#e6edf3">Citation-grounded Markdown research reporting with [P1], [P2] labels (ARIA)</tspan></text>
</g>

<g transform="translate(24, 388)">
  <rect width="812" height="68" rx="6" class="node-box"/>
  <rect x="0" y="6" width="4" height="56" rx="2" fill="#39d353"/>
  
  <rect x="14" y="10" width="70" height="20" rx="4" fill="#0d1117" stroke="#39d353" stroke-width="0.8"/>
  <text x="49" y="23.5" fill="#39d353" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 05</text>
  
  <rect x="90" y="10" width="74" height="20" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
  <text x="127" y="23.5" fill="#7d8590" font-size="9" font-weight="600" text-anchor="middle">CURRENT</text>
  
  <text x="176" y="24" fill="#e6edf3" font-size="12.5" font-weight="700">Agentic AI &amp; Autonomous Workflows</text>
  
  <text x="16" y="45" fill="#e6edf3" font-size="9.5">● <tspan fill="#7d8590">LangGraph stateful DAG machines: multi-step reasoning &amp; decision loops · </tspan><tspan fill="#e6edf3">Coupling Random Forest regression with Groq LPU / Llama 3 agents</tspan></text>
  <text x="16" y="59" fill="#39d353" font-size="9.5">● <tspan fill="#e6edf3">Designing production-quality AI applications solving real-world challenges</tspan></text>
</g>


</svg>
