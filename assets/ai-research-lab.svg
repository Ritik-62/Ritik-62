<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<style>
  .flow-line { stroke: #30363d; stroke-width: 2; fill: none; }
  .flow-pulse { stroke-dasharray: 8 16; stroke-dashoffset: 0; animation: flow 2.5s linear infinite; fill: none; }
  .node-box { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; transition: all 0.3s; }
  .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  .status-pulse { animation: blink 1.8s ease-in-out infinite alternate; }
  @keyframes flow { to { stroke-dashoffset: -48; } }
  @keyframes pulse { 0%, 100% { opacity: 0.3; r: 3; } 50% { opacity: 1; r: 4.5; } }
  @keyframes blink { 0% { opacity: 0.4; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .flow-pulse, .pulse-dot, .status-pulse { animation: none !important; stroke-dashoffset: 0 !important; }
  }
</style>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#39d353"/></linearGradient>
  <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d353"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="purpleLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bc8cff"/><stop offset="1" stop-color="#ffa657"/></linearGradient>
  <linearGradient id="orangeLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffa657"/><stop offset="1" stop-color="#39d353"/></linearGradient>
</defs>
