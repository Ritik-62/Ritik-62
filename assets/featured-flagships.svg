<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

<style>
  .flow-line { stroke: #30363d; stroke-width: 1.5; fill: none; }
  .node-box { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
  .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  .status-pulse { animation: blink 1.8s ease-in-out infinite alternate; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; r: 3; } 50% { opacity: 1; r: 4.5; } }
  @keyframes blink { 0% { opacity: 0.4; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .pulse-dot, .status-pulse { animation: none !important; }
  }
</style>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
</defs>

<rect width="860" height="520" rx="10" fill="url(#bgGrad)"/>
<rect x="0.5" y="0.5" width="859" height="519" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
<line x1="0" y1="30" x2="860" y2="30" stroke="#30363d"/>
<circle cx="20" cy="15.0" r="5" fill="#ff5f56"/>
<circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="15.0" r="5" fill="#39d353"/>
